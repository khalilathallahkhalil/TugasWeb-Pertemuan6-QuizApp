<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="brand-title">Quiz App</h1>
      <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle Theme">🐟</button>
    </header>

    <section id="start-screen" class="screen active">
      <h2 class="screen-title">Uji Pengetahuan Pemrograman</h2>
      <p class="subtitle">Isi nama dan pilih bahasa pemrograman untuk memulai kuis.</p>

      <form id="start-form">
        <div class="form-group">
          <label for="username-input">Nama Lengkap</label>
          <input type="text" id="username-input" placeholder="Masukkan nama Anda..." required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="category-select">Bahasa Pemrograman</label>
          <select id="category-select" required>
            <option value="js">JavaScript</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
          </select>
        </div>

        <div class="high-score-badge">
          Skor Tertinggi: <span id="start-high-score">0</span>
        </div>

        <button type="submit" id="start-btn" class="btn primary">Mulai Kuis</button>
      </form>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <div class="quiz-meta">
          <span id="question-tracker" class="question-tracker">Soal 1 dari 10</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <h2 id="question-text" class="question-text"></h2>

      <div id="options-container" class="options-container"></div>

      <div class="quiz-footer">
        <button id="next-btn" class="btn primary hidden">Soal Berikutnya</button>
      </div>
    </section>

    <section id="result-screen" class="screen">
      <h2 class="screen-title">Hasil Kuis</h2>
      <p class="result-greeting">Selamat <span id="res-name"></span>, Anda telah menyelesaikan kuis <span id="res-materi"></span>!</p>

      <div class="result-card">
        <div class="result-item correct-box">
          <span class="label">Benar</span>
          <span id="res-correct" class="value">0</span>
        </div>
        <div class="result-item wrong-box">
          <span class="label">Salah</span>
          <span id="res-wrong" class="value">0</span>
        </div>
        <div class="result-item score-box">
          <span class="label">Nilai Akhir</span>
          <span id="res-score" class="value">0</span>
        </div>
      </div>

      <p id="high-score-msg" class="high-score-msg"></p>
      <button id="restart-btn" class="btn primary">Kembali ke Menu Utama</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
